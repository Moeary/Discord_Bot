[workspace]
name = "dc-bot"
version = "0.1.0"
description = "Discord entertainment bot with FastAPI dashboard"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
check = "python -c \"import app.main; print('app-import-ok')\""
dev = "python -m app.run --reload"
start = "python -m app.run"

[dependencies]
python = "3.10.*"
pip = ">=24,<26"

[pypi-dependencies]
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.30,<1.0", extras = ["standard"] }
"discord.py" = ">=2.4,<3.0"
httpx = ">=0.27,<1.0"
pydantic = ">=2.9,<3.0"
pydantic-settings = ">=2.5,<3.0"
jinja2 = ">=3.1,<4.0"
python-dotenv = ">=1.0,<2.0"
