name: Paper Bridge Jar

on:
  workflow_dispatch:
    inputs:
      version:
        description: Jar version, for example 0.1.0
        required: true
        default: "0.1.0"

jobs:
  build:
    name: Build Paper Bridge Jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: |
          chmod +x paper-bridge/gradlew
          paper-bridge/gradlew -p paper-bridge -PpluginVersion=${{ inputs.version }} build

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: dc-bot-paper-bridge-${{ inputs.version }}
          path: paper-bridge/build/libs/*.jar
          if-no-files-found: error
