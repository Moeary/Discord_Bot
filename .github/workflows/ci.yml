name: FastAPI CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  fastapi:
    name: FastAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import check
        run: python -c "import app.main; import app.run; print('app-import-ok')"
